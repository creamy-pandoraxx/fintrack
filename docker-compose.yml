services:
  postgres:
    image: postgres:16
    container_name: fintrack-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack_password}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack_db}
    volumes:
      - fintrack_postgres_data:/var/lib/postgresql/data

volumes:
  fintrack_postgres_data:
